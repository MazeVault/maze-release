name: Publish Customer Helm Chart

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      chartVersion:
        description: "Chart version override (SemVer, for manual runs only)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  CHART_PATH: helm/mazevault-customer
  CHART_NAME: mazevault-customer

jobs:
  publish:
    name: Publish Helm Chart (OCI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up yq
        uses: mikefarah/yq@v4

      - name: Set chart version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          VERSION="${TAG#v}"
          if [[ -n "${{ inputs.chartVersion }}" ]]; then
            VERSION="${{ inputs.chartVersion }}"
            TAG="v${VERSION}"
          elif [[ "$TAG" == "manual" ]]; then
            VERSION="$(yq '.version' "$CHART_PATH/Chart.yaml")"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid chart version resolved from tag: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint "$CHART_PATH"

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "$CHART_PATH" \
            --destination dist \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.tag }}"
          ls -lh dist

      - name: Login to GHCR Helm OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Publish chart to GHCR OCI
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push "dist/${CHART_NAME}-${{ steps.version.outputs.version }}.tgz" \
            "oci://ghcr.io/${OWNER_LC}/charts"

      - name: Output pull/install commands
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Chart published to: oci://ghcr.io/${OWNER_LC}/charts/${CHART_NAME}:${VERSION}"
          echo "Install: helm install mazevault oci://ghcr.io/${OWNER_LC}/charts/${CHART_NAME} --version ${VERSION} -n mazevault --create-namespace -f values.customer.yaml"

{{- if and .Values.backend.enabled .Values.podDisruptionBudget.backend.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mazevault-customer.componentName" (dict "root" . "component" "backend-pdb") }}
  namespace: {{ include "mazevault-customer.namespace" . }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.backend.minAvailable }}
  selector:
    matchLabels:
      {{- include "mazevault-customer.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
---
{{- end }}
{{- if and .Values.frontend.enabled .Values.podDisruptionBudget.frontend.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mazevault-customer.componentName" (dict "root" . "component" "frontend-pdb") }}

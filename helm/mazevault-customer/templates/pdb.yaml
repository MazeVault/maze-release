---
{{- end }}
{{- if and .Values.ocsp.enabled .Values.podDisruptionBudget.ocsp.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mazevault-customer.componentName" (dict "root" . "component" "ocsp-pdb") }}
  namespace: {{ include "mazevault-customer.namespace" . }}
spec:

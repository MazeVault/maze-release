{{- if and .Values.global.keyVault.enabled .Values.global.keyVault.secretStore.create }}
apiVersion: external-secrets.io/v1beta1
kind: {{ .Values.global.keyVault.secretStore.kind }}
metadata:
  name: {{ include "mazevault-customer.secretStoreName" . }}
  namespace: {{ include "mazevault-customer.namespace" . }}
  labels:
    {{- include "mazevault-customer.componentLabels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ .Values.global.keyVault.secretStore.vaultUrl | quote }}
      {{- if .Values.global.keyVault.secretStore.tenantId }}
      tenantId: {{ .Values.global.keyVault.secretStore.tenantId | quote }}
      {{- end }}
      serviceAccountRef:
        name: {{ include "mazevault-customer.serviceAccountName" . }}
        namespace: {{ include "mazevault-customer.namespace" . }}
{{- end }}
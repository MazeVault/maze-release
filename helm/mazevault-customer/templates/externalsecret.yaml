{{- if .Values.global.keyVault.enabled }}
{{- $databaseDSN := printf "host=%s user=%s password={{ .dbPassword }} dbname=%s port=%v sslmode=%s" .Values.externalDatabase.host .Values.externalDatabase.username .Values.externalDatabase.name .Values.externalDatabase.port .Values.externalDatabase.sslMode }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mazevault-customer.runtimeSecretName" . }}
  namespace: {{ include "mazevault-customer.namespace" . }}
  labels:
    {{- include "mazevault-customer.componentLabels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: {{ .Values.global.keyVault.secretStore.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.global.keyVault.secretStore.kind }}
    name: {{ include "mazevault-customer.secretStoreName" . }}
  target:
    name: {{ include "mazevault-customer.runtimeSecretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{- if eq .Values.externalDatabase.secretMode "remoteRef" }}
        DATABASE_URL: "{{ `{{ .databaseUrl }}` }}"
        DB_CONNECTION: "{{ `{{ .databaseUrl }}` }}"
        {{- else }}
        DATABASE_URL: {{ $databaseDSN | quote }}
        DB_CONNECTION: {{ $databaseDSN | quote }}
        {{- end }}
        {{- if eq .Values.externalRedis.secretMode "remoteRef" }}
        REDIS_URL: "{{ `{{ .redisUrl }}` }}"
        {{- else if .Values.externalRedis.connectionQuery }}
        REDIS_URL: {{ printf "%s://:{{ .redisPassword }}@%s:%v/%v?%s" .Values.externalRedis.scheme .Values.externalRedis.host .Values.externalRedis.port .Values.externalRedis.database .Values.externalRedis.connectionQuery | quote }}
        {{- else }}
        REDIS_URL: {{ printf "%s://:{{ .redisPassword }}@%s:%v/%v" .Values.externalRedis.scheme .Values.externalRedis.host .Values.externalRedis.port .Values.externalRedis.database | quote }}
        {{- end }}
        MAZEVAULT_MASTER_KEY: "{{ `{{ .masterKey }}` }}"
        MAZEVAULT_JWT_KEY: "{{ `{{ .jwtKey }}` }}"
        MAZEVAULT_SESSION_SECRET: "{{ `{{ .sessionSecret }}` }}"
        {{- if .Values.global.keyVault.secretKeys.buildAuthSecret }}
        BUILD_AUTH_SECRET: "{{ `{{ .buildAuthSecret }}` }}"
        {{- end }}
        {{- if .Values.global.keyVault.secretKeys.smtpPassword }}
        SMTP_PASSWORD: "{{ `{{ .smtpPassword }}` }}"
        {{- end }}
        {{- if .Values.global.keyVault.secretKeys.o365ClientSecret }}
        O365_CLIENT_SECRET: "{{ `{{ .o365ClientSecret }}` }}"
        {{- end }}
        {{- if .Values.global.keyVault.secretKeys.entraClientId }}
        ENTRA_CLIENT_ID: "{{ `{{ .entraClientId }}` }}"
        {{- end }}
        {{- if .Values.global.keyVault.secretKeys.entraClientSecret }}
        ENTRA_CLIENT_SECRET: "{{ `{{ .entraClientSecret }}` }}"
        {{- end }}
        {{- if .Values.global.keyVault.secretKeys.entraTenantId }}
        ENTRA_TENANT_ID: "{{ `{{ .entraTenantId }}` }}"
        {{- end }}
        {{- if .Values.global.keyVault.secretKeys.agentBinaryGithubToken }}
        AGENT_BINARY_GITHUB_TOKEN: "{{ `{{ .agentBinaryGithubToken }}` }}"
        {{- end }}
  data:
    {{- if eq .Values.externalDatabase.secretMode "remoteRef" }}
    - secretKey: databaseUrl
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.databaseUrl | quote }}
    {{- else }}
    - secretKey: dbPassword
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.databasePassword | quote }}
    {{- end }}
    {{- if eq .Values.externalRedis.secretMode "remoteRef" }}
    - secretKey: redisUrl
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.redisUrl | quote }}
    {{- else }}
    - secretKey: redisPassword
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.redisPassword | quote }}
    {{- end }}
    - secretKey: masterKey
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.masterKey | quote }}
    - secretKey: jwtKey
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.jwtKey | quote }}
    - secretKey: sessionSecret
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.sessionSecret | quote }}
    {{- if .Values.global.keyVault.secretKeys.buildAuthSecret }}
    - secretKey: buildAuthSecret
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.buildAuthSecret | quote }}
    {{- end }}
    {{- if .Values.global.keyVault.secretKeys.smtpPassword }}
    - secretKey: smtpPassword
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.smtpPassword | quote }}
    {{- end }}
    {{- if .Values.global.keyVault.secretKeys.o365ClientSecret }}
    - secretKey: o365ClientSecret
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.o365ClientSecret | quote }}
    {{- end }}
    {{- if .Values.global.keyVault.secretKeys.entraClientId }}
    - secretKey: entraClientId
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.entraClientId | quote }}
    {{- end }}
    {{- if .Values.global.keyVault.secretKeys.entraClientSecret }}
    - secretKey: entraClientSecret
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.entraClientSecret | quote }}
    {{- end }}
    {{- if .Values.global.keyVault.secretKeys.entraTenantId }}
    - secretKey: entraTenantId
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.entraTenantId | quote }}
    {{- end }}
    {{- if .Values.global.keyVault.secretKeys.agentBinaryGithubToken }}
    - secretKey: agentBinaryGithubToken
      remoteRef:
        key: {{ .Values.global.keyVault.secretKeys.agentBinaryGithubToken | quote }}
    {{- end }}
{{- end }}
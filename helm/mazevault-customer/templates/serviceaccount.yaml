{{- if .Values.global.serviceAccount.create }}
{{- $annotations := dict }}
{{- range $key, $value := .Values.global.serviceAccount.annotations }}
{{- $_ := set $annotations $key $value }}
{{- end }}
{{- if and .Values.global.workloadIdentity.enabled .Values.global.workloadIdentity.clientId }}
{{- $_ := set $annotations "azure.workload.identity/client-id" .Values.global.workloadIdentity.clientId }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mazevault-customer.serviceAccountName" . }}
  namespace: {{ include "mazevault-customer.namespace" . }}
  labels:
    {{- include "mazevault-customer.componentLabels" (dict "root" . "component" "platform") | nindent 4 }}
  {{- if gt (len $annotations) 0 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
{{- end }}
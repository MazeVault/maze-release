{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mazevault-customer.componentName" (dict "root" . "component" "backend") }}
  namespace: {{ include "mazevault-customer.namespace" . }}
  labels:
    {{- include "mazevault-customer.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
  {{- if and .Values.global.reloader.enabled .Values.global.reloader.annotations }}
  annotations:
    {{- toYaml .Values.global.reloader.annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: {{ .Values.backend.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.backend.strategy.type }}
  selector:
    matchLabels:
      {{- include "mazevault-customer.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mazevault-customer.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
        {{- if .Values.global.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.global.rolloutNonce .Values.global.podAnnotations .Values.backend.podAnnotations }}
      annotations:
        {{- if .Values.global.rolloutNonce }}
        mazevault.io/rollout-nonce: {{ .Values.global.rolloutNonce | quote }}
        {{- end }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mazevault-customer.serviceAccountName" . }}
      containers:
        - name: backend
          image: {{ printf "%s:%s" .Values.backend.image.repository .Values.backend.image.tag | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: REDIS_URL
            - name: MAZEVAULT_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: MAZEVAULT_MASTER_KEY
            - name: MAZEVAULT_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: MAZEVAULT_JWT_KEY
            - name: MAZEVAULT_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: MAZEVAULT_SESSION_SECRET
            - name: BUILD_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: BUILD_AUTH_SECRET
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: SMTP_PASSWORD
                  optional: true
            - name: O365_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: O365_CLIENT_SECRET
                  optional: true
            {{- if .Values.global.keyVault.secretKeys.entraClientId }}
            - name: ENTRA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: ENTRA_CLIENT_ID
                  optional: true
            {{- else if .Values.backend.config.ENTRA_CLIENT_ID }}
            - name: ENTRA_CLIENT_ID
              value: {{ .Values.backend.config.ENTRA_CLIENT_ID | quote }}
            {{- end }}
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: ENTRA_CLIENT_SECRET
                  optional: true
            {{- if .Values.global.keyVault.secretKeys.entraTenantId }}
            - name: ENTRA_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: ENTRA_TENANT_ID
                  optional: true
            {{- else if .Values.backend.config.ENTRA_TENANT_ID }}
            - name: ENTRA_TENANT_ID
              value: {{ .Values.backend.config.ENTRA_TENANT_ID | quote }}
            {{- end }}
            - name: AGENT_BINARY_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mazevault-customer.runtimeSecretName" . }}
                  key: AGENT_BINARY_GITHUB_TOKEN
                  optional: true
            - name: FRONTEND_URL
              value: {{ default (printf "https://%s" .Values.global.ingress.appHost) .Values.backend.urls.frontend | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ default (printf "https://%s" .Values.global.ingress.appHost) .Values.backend.urls.allowedOrigins | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ default (printf "https://%s" .Values.global.ingress.appHost) .Values.backend.urls.corsAllowedOrigins | quote }}
            - name: MAZEVAULT_SERVER_URL
              value: {{ default (printf "https://%s" .Values.global.ingress.appHost) .Values.backend.urls.server | quote }}
            - name: OCSP_URL
              value: {{ default (printf "http://%s:%v" (include "mazevault-customer.componentName" (dict "root" . "component" "ocsp")) .Values.ocsp.service.port) .Values.backend.urls.ocsp | quote }}
            {{- range $key, $value := .Values.backend.config }}
            {{- if and (ne $key "ENTRA_CLIENT_ID") (ne $key "ENTRA_TENANT_ID") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.startupProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.startupProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if .Values.backend.dataVolume.enabled }}
          volumeMounts:
            - name: backend-data
              mountPath: {{ .Values.backend.dataVolume.mountPath }}
          {{- end }}
      {{- if .Values.backend.dataVolume.enabled }}
      volumes:
        - name: backend-data
          emptyDir: {}
      {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mazevault-customer.componentName" (dict "root" . "component" "frontend") }}
  namespace: {{ include "mazevault-customer.namespace" . }}
  labels:
    {{- include "mazevault-customer.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  {{- if and .Values.global.reloader.enabled .Values.global.reloader.annotations }}
  annotations:
    {{- toYaml .Values.global.reloader.annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: {{ .Values.frontend.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.frontend.strategy.type }}
  selector:
    matchLabels:
      {{- include "mazevault-customer.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mazevault-customer.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
        {{- with .Values.frontend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.global.rolloutNonce .Values.global.podAnnotations .Values.frontend.podAnnotations }}
      annotations:
        {{- if .Values.global.rolloutNonce }}
        mazevault.io/rollout-nonce: {{ .Values.global.rolloutNonce | quote }}
        {{- end }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.frontend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ printf "%s:%s" .Values.frontend.image.repository .Values.frontend.image.tag | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          env:
            - name: BACKEND_HOST
              value: {{ include "mazevault-customer.componentName" (dict "root" . "component" "backend") | quote }}
            - name: DOCS_URL
              value: {{ default (printf "https://%s" .Values.global.ingress.docsHost) .Values.frontend.urls.docs | quote }}
            - name: MAZEVAULT_DOMAIN
              value: {{ default .Values.global.ingress.appHost .Values.frontend.urls.domain | quote }}
            {{- range $key, $value := .Values.frontend.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.frontend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: frontend-nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: frontend-nginx-template
          configMap:
            name: {{ include "mazevault-customer.fullname" . }}-frontend-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}

{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mazevault-customer.componentName" (dict "root" . "component" "backend") }}
  namespace: {{ include "mazevault-customer.namespace" . }}
  labels:
    {{- include "mazevault-customer.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "mazevault-customer.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
---
{{- end }}

{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mazevault-customer.fullname" . }}-frontend-nginx
  namespace: {{ include "mazevault-customer.namespace" . }}
  labels:
    {{- include "mazevault-customer.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
data:
  default.conf.template: |
    server {
        listen 80;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            # Shipped in the frontend image; shared with its nginx.ssl.conf.
            include /etc/nginx/snippets/security-headers.conf;
        }

        location ^~ /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security-headers.conf;
        }

        location = /config.js {
          root /usr/share/nginx/html;
          default_type application/javascript;
          add_header Cache-Control "no-store, no-cache, must-revalidate" always;
          include /etc/nginx/snippets/security-headers.conf;
        }

        # A missing file (favicon.ico, sitemap.xml, a stale chunk) is a 404, not the SPA shell.
        location ~* \.[a-z0-9]+$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location ^~ /api/v1/agents/me/connect {
            proxy_pass http://${BACKEND_HOST}:{{ .Values.backend.service.port }}/api/v1/agents/me/connect;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /api/ {
            proxy_pass http://${BACKEND_HOST}:{{ .Values.backend.service.port }}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Long-running rotation trigger endpoints synchronously run a gateway
            # pre-execution probe (Key Vault reachability) that can block for up to
            # ~2 minutes before returning 202. Nginx's default proxy_read_timeout is
            # 60s, which would return 504 to the client while the backend keeps
            # executing — the frontend then retries and fires duplicate rotations.
            # Align with the ingress annotation (proxy-read-timeout: "300").
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
---
{{- end }}
{{- if .Values.docs.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mazevault-customer.fullname" . }}-docs-nginx
  namespace: {{ include "mazevault-customer.namespace" . }}
  labels:
    {{- include "mazevault-customer.componentLabels" (dict "root" . "component" "docs") | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
{{- end }}